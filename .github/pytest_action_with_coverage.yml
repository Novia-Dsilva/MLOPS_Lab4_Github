name: Testing with Pytest and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests with Coverage
      run: |
        pytest test/test_pytest.py --cov=src --cov-report=xml --cov-report=term-missing --junitxml=pytest-report.xml -v
      continue-on-error: false

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v2
      with:
        name: coverage-report
        path: coverage.xml

    - name: Upload Test Results
      uses: actions/upload-artifact@v2
      with:
        name: test-results
        path: pytest-report.xml

    - name: Notify on Success
      if: success()
      run: echo "✅ Tests passed successfully with coverage report generated"

    - name: Notify on Failure
      if: failure()
      run: echo "❌ Tests failed"